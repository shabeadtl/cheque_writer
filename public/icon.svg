<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004D40"/>
      <stop offset="50%" stop-color="#00695C"/>
      <stop offset="100%" stop-color="#00897B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#001814" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Border accent -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Cheque Card Graphic -->
  <g filter="url(#shadow)">
    <rect x="76" y="140" width="360" height="232" rx="20" fill="#FFFFFF"/>
    
    <!-- Cheque Top Header Bar -->
    <rect x="76" y="140" width="360" height="44" rx="20" fill="#E0F2F1"/>
    <rect x="76" y="164" width="360" height="20" fill="#E0F2F1"/>

    <!-- Bank Logo Mark Placeholder -->
    <circle cx="112" cy="162" r="12" fill="#00695C"/>
    <rect x="134" y="156" width="90" height="12" rx="3" fill="#004D40"/>

    <!-- Date Box -->
    <rect x="330" y="154" width="86" height="16" rx="4" fill="none" stroke="#B2DFDB" stroke-width="2"/>
    <rect x="338" y="159" width="70" height="6" rx="2" fill="#80CBC4"/>

    <!-- Payee Line -->
    <text x="100" y="222" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#00695C">PAY</text>
    <line x1="135" y1="222" x2="330" y2="222" stroke="#B2DFDB" stroke-width="2" stroke-dasharray="4 2"/>

    <!-- Amount Figures Box -->
    <rect x="345" y="206" width="72" height="32" rx="6" fill="#F1F8E9" stroke="#81C784" stroke-width="2"/>
    <text x="353" y="227" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#2E7D32">OMR</text>

    <!-- Amount in Words Lines -->
    <line x1="100" y1="260" x2="416" y2="260" stroke="#B2DFDB" stroke-width="2"/>
    <line x1="100" y1="288" x2="280" y2="288" stroke="#B2DFDB" stroke-width="2"/>

    <!-- Signature Line -->
    <line x1="310" y1="316" x2="416" y2="316" stroke="#004D40" stroke-width="2"/>
    <text x="332" y="332" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#78909C">AUTHORIZED</text>

    <!-- Security Microprint / Bottom Band -->
    <rect x="76" y="348" width="360" height="24" rx="4" fill="#F5F5F5"/>
    <text x="100" y="364" font-family="monospace" font-size="12" fill="#546E7A">⑈ 123456 ⑈ 020 ⑈ 00123456789 ⑈</text>
  </g>

  <!-- Pen / Sparkle Accent in Gold -->
  <g transform="translate(360, 96)">
    <circle cx="28" cy="28" r="28" fill="url(#gold)" filter="url(#shadow)"/>
    <path d="M19 37 L37 19 M37 19 L32 14 L14 32 L13 39 L20 38 Z" fill="#004D40"/>
  </g>
</svg>
